<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WBL Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef6ff;color:#10243a}.wrap{max-width:1200px;margin:auto;padding:25px 16px}.card{background:#fff;border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 28px #07579c18}h1{color:#07579c}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}input,select,button{padding:11px;border:1px solid #c8d8e8;border-radius:10px;font-size:15px}button{background:#07579c;color:#fff;border:0;font-weight:700;cursor:pointer}.danger{background:#444}.wide{grid-column:1/-1}.msg{margin-top:10px;padding:10px;border-radius:10px;background:#e9f5ff}.statgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.statgrid input{width:100%}.player-row{padding:12px;border:1px solid #dbe8f4;border-radius:12px;margin:8px 0;background:#fbfdff}.player-row strong{display:block;margin-bottom:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="wrap">
<h1>⚾ WBL 관리자 시스템</h1>
<div id="login" class="card"><h2>관리자 로그인</h2><div class="grid"><div class="field"><label>이메일</label><input id="email" type="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password"></div></div><br><button onclick="login()">로그인</button><div id="loginMsg"></div></div>
<div id="app" class="hidden">
<div class="card"><b id="who"></b><button class="danger" style="float:right" onclick="logout()">로그아웃</button><div style="clear:both"></div></div>
<div class="grid">
<section class="card"><h2>🏟️ 팀 추가</h2><div class="field"><label>팀 이름</label><input id="teamName"></div><div class="field"><label>로고 URL (선택)</label><input id="teamLogo"></div><br><button onclick="addTeam()">팀 추가</button><div id="teamMsg"></div></section>
<section class="card"><h2>👤 선수 추가</h2><div class="field"><label>선수 이름</label><input id="playerName"></div><div class="field"><label>포지션</label><input id="position" placeholder="SS, CF, P 등"></div><div class="field"><label>팀</label><select id="teamSelect"></select></div><br><button onclick="addPlayer()">선수 추가</button><div id="playerMsg"></div></section>
</div>
<section class="card"><h2>📅 경기 등록</h2><div class="grid"><div class="field"><label>경기 날짜</label><input id="gameDate" type="date"></div><div></div><div class="field"><label>홈팀</label><select id="homeTeam" onchange="renderPlayers()"></select></div><div class="field"><label>원정팀</label><select id="awayTeam" onchange="renderPlayers()"></select></div><div class="field"><label>홈팀 점수</label><input id="homeScore" type="number" min="0" value="0"></div><div class="field"><label>원정팀 점수</label><input id="awayScore" type="number" min="0" value="0"></div></div></section>
<section class="card"><h2>🏏 선수별 타격 기록</h2><p>이 경기에서 실제로 출전한 선수만 입력하면 됩니다.</p><div id="batPlayers"></div></section>
<section class="card"><h2>⚾ 선수별 투구 기록</h2><div id="pitPlayers"></div></section>
<section class="card"><button onclick="saveGame()">경기와 모든 선수 기록 저장</button><div id="gameMsg"></div></section>
</div></div>
<script>
const SUPABASE_URL='https://gqfkphyslcuijqqanvev.supabase.co',SUPABASE_KEY='sb_publishable_vTn1dcPB1Jo8qWgSKvD9NQ_TrTlufmD';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
let teams=[],players=[];
const batFields=[['g','G'],['pa','PA'],['ab','AB'],['r','R'],['h','H'],['doubles','2B'],['triples','3B'],['hr','HR'],['rbi','RBI'],['bb','BB'],['so','SO'],['sb','SB'],['cs','CS']];
const pitFields=[['g','G'],['gs','GS'],['w','W'],['l','L'],['sv','SV'],['ip','IP'],['h','H'],['er','ER'],['bb','BB'],['so','SO']];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}init()}
async function logout(){await sb.auth.signOut();location.reload()}
async function init(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:ok}=await sb.rpc('is_admin');if(!ok){$('login').innerHTML='<h2>접근 거부</h2><p>이 계정은 WBL 관리자가 아닙니다.</p>';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='관리자: '+user.email;await loadTeams();await loadPlayers();renderPlayers()}
async function loadTeams(){const {data}=await sb.from('teams').select('id,name').order('name');teams=data||[];const opts='<option value="">선택</option>'+teams.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('');$('teamSelect').innerHTML=opts;$('homeTeam').innerHTML=opts;$('awayTeam').innerHTML=opts}
async function loadPlayers(){const {data}=await sb.from('players').select('id,name,team_id,position').eq('active',true).order('name');players=data||[]}
async function addTeam(){const {error}=await sb.rpc('admin_upsert_team',{p_name:$('teamName').value,p_logo_url:$('teamLogo').value});$('teamMsg').textContent=error?error.message:'팀이 추가되었습니다.';if(!error){$('teamName').value='';$('teamLogo').value='';await loadTeams();renderPlayers()}}
async function addPlayer(){if(!$('teamSelect').value){$('playerMsg').textContent='팀을 선택하세요.';return}const {error}=await sb.rpc('admin_upsert_player',{p_name:$('playerName').value,p_position:$('position').value,p_team_id:$('teamSelect').value});$('playerMsg').textContent=error?error.message:'선수가 추가되었습니다.';if(!error){$('playerName').value='';$('position').value='';await loadPlayers();renderPlayers()}}
function teamPlayers(){const ids=[$('homeTeam').value,$('awayTeam').value];return players.filter(p=>ids.includes(p.team_id))}
function fieldsHTML(type,p){const fields=type==='bat'?batFields:pitFields;return fields.map(([k,l])=>'<label>'+l+'<input data-k="'+k+'" type="number" min="0" step="'+(k==='ip'?'0.1':'1')+'" value="0"></label>').join('')}
function renderPlayers(){const ps=teamPlayers();$('batPlayers').innerHTML=ps.length?ps.map(p=>'<div class="player-row" data-player="'+p.id+'" data-team="'+p.team_id+'" data-type="bat"><strong>'+esc(p.name)+' · '+esc(p.position||'')+'</strong><div class="statgrid">'+fieldsHTML('bat',p)+'</div></div>').join(''):'<p>홈팀과 원정팀을 선택하면 선수가 표시됩니다.</p>';$('pitPlayers').innerHTML=ps.length?ps.map(p=>'<div class="player-row" data-player="'+p.id+'" data-team="'+p.team_id+'" data-type="pit"><strong>'+esc(p.name)+' · '+esc(p.position||'')+'</strong><div class="statgrid">'+fieldsHTML('pit',p)+'</div></div>').join(''):'<p>홈팀과 원정팀을 선택하면 선수가 표시됩니다.</p>'}
function collect(type){return [...document.querySelectorAll('.player-row[data-type="'+type+'"]')].map(row=>{const o={player_id:row.dataset.player,team_id:row.dataset.team};row.querySelectorAll('input').forEach(i=>o[i.dataset.k]=Number(i.value||0));return o}).filter(o=>Object.values(o).some(v=>typeof v==='number'&&v>0))}
async function saveGame(){if(!$('gameDate').value||!$('homeTeam').value||!$('awayTeam').value){$('gameMsg').textContent='날짜와 두 팀을 모두 선택하세요.';return}if($('homeTeam').value===$('awayTeam').value){$('gameMsg').textContent='홈팀과 원정팀은 달라야 합니다.';return}const batting=collect('bat'),pitching=collect('pit');const {data,error}=await sb.rpc('admin_create_game',{p_game_date:$('gameDate').value,p_home_team_id:$('homeTeam').value,p_away_team_id:$('awayTeam').value,p_home_score:Number($('homeScore').value),p_away_score:Number($('awayScore').value),p_batting:batting,p_pitching:pitching});$('gameMsg').textContent=error?error.message:'경기와 선수 기록이 저장되었습니다. 시즌 누적 통계에도 반영되었습니다.';if(!error){document.querySelectorAll('#batPlayers input,#pitPlayers input').forEach(i=>i.value=0);}}
sb.auth.getSession().then(init);
</script></body></html>
